[mod]
id = "rightharvest"
version = "0.2.1"
priority = 100

# The commit it was tested on.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "native_rightharvest"
source = "runtime.rs"

[[injection]]
id = "listed"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The block's own right-click begin, at the named hook: the id resolves against
# whatever revision the bundle is applied to, so a use_hand that moves between
# modules no longer breaks it. Canceling the click ends it like a vanilla use.
[[injection]]
id = "block-use"
kind = "HEAD"
hook = "right_click_block"
hook_version = 1
helper = "harvest.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]
